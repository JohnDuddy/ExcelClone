[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duddy-spreadsheet"
version = "1.0.0"
description = "Offline financial modeling workbench for regulated environments"
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "performance: measured performance acceptance scenarios",
]

[tool.coverage.run]
branch = true
source = ["duddysheet/core"]

[tool.coverage.report]
fail_under = 90
show_missing = true

